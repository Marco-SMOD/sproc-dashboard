<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SPROC Dashboard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">SPROC Dashboard</h1>
            <p class="text-gray-500 mt-2">建材采购与项目管理看板</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <input type="password" id="pwd" placeholder="请输入访问密码" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <button onclick="checkPwd()" 
                    class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-3 rounded-lg font-medium hover:opacity-90 transition">
                进入 Dashboard
            </button>
        </div>
        
        <p id="error" class="text-red-500 text-sm mt-4 text-center hidden">密码错误</p>
    </div>

    <script>
        function checkPwd() {
            const pwd = document.getElementById('pwd').value;
            if (pwd === 'sproc2026') {
                sessionStorage.setItem('sproc_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error').classList.remove('hidden');
            }
        }
        
        document.getElementById('pwd').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPwd();
        });
    </script>
</body>
</html>
